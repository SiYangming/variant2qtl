# Example: download annotation caches then annotate
#
#   nextflow run . -profile docker -stub \
#     -params-file assets/params_cache_annotate.yml \
#     --outdir results_cache_annotate
#
# For a real VEP run, drop -stub and point annotate_tools at ensemblvep (or both).

input: assets/samplesheet_stub.csv
igenomes_ignore: true
validate_params: false

run_cache: true
cache_tools: snpeff
annotate_snpeff_db: GRCh38.99

run_annotate: true
annotate_tools: snpeff
annotate_vcf: assets/testdata/vcf_api_mini/sample.vcf.gz
annotate_vcf_tbi: assets/testdata/vcf_api_mini/sample.vcf.gz.tbi
annotate_filter: false
