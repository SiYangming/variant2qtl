# Example: Somalier relate + genotype QC extras in one run
#
#   nextflow run . -profile docker -stub \
#     -params-file assets/params_qc_somalier.yml \
#     --outdir results_qc_somalier

input: assets/samplesheet_stub.csv
igenomes_ignore: true
validate_params: false

genotype_input: assets/genotype_samplesheet.csv
run_genotype_ingest: true
run_genotype_qc: true
genotype_qc_args: "--maf 0.01 --hwe 1e-6 --geno 0.2"
genotype_qc_run_het: true
genotype_qc_run_relatedness: true
genotype_qc_run_pca: true
genotype_qc_use_somalier: true

run_relate: true
relate_vcf: assets/testdata/vcf_api_mini/multi.vcf.gz
relate_vcf_tbi: assets/testdata/vcf_api_mini/multi.vcf.gz.tbi
relate_fasta: assets/testdata/vcf_api_mini/ref.fa
relate_fasta_fai: assets/testdata/vcf_api_mini/ref.fa.fai
relate_sites: assets/testdata/vcf_api_mini/sites.vcf.gz
