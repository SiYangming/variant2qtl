repository_type: pipeline

nf_core_version: 3.5.2

lint:
  # Skip template recreate check: personal org + digit in name makes create flaky/hangy
  files_unchanged: false
  # Personal (is_nfcore: false) pipeline: skip nf-core modules/subworkflows component
  # lint (version bumps + pinned-utils check_local_copy). Local nextflow lint is the gate.
  nfcore_components: false
  # Version string is release-style until first tagged release
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - manifest.version
  multiqc_config:
    - report_comment
  # Zenodo DOI filled after first release
  readme: false
  # AWS test workflows not used for this personal pipeline
  actions_awstest: false
  actions_awsfulltest: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-variant2qtl_logo_light.png
    - docs/images/nf-core-variant2qtl_logo_light.png
    - docs/images/nf-core-variant2qtl_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: SiYangming
  name: variant2qtl
  description: An end-to-end, multi-entry Nextflow pipeline for comprehensive QTL (eQTL/sQTL/pQTL) analysis, integrating diverse genetic variants (SNPs, Indels, STRs, and SVs) with automated functional annotation.
  author: siyangming
  version: 0.0.1dev
  force: true
  outdir: .
  skip_features: []
  is_nfcore: false
