---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gemma_lmm"
description: Run GEMMA exact linear mixed model association (-lmm)
keywords:
  - gemma
  - lmm
  - gwas
  - association
tools:
  - "gemma":
      description: "Linear mixed models (LMMs) for genome-wide association (GWA)"
      homepage: "https://github.com/genetics-statistics/GEMMA"
      documentation: "https://www.xzlab.org/software.html"
      tool_dev_url: "https://github.com/genetics-statistics/GEMMA"
      licence: ["GPL-3.0-only"]
      identifier: ""

input:
  - - meta:
        type: map
        description: Groovy map containing sample information e.g. [ id:'test' ]
    - bed:
        type: file
        description: PLINK bed
        pattern: "*.bed"
    - bim:
        type: file
        description: PLINK bim
        pattern: "*.bim"
    - fam:
        type: file
        description: PLINK fam
        pattern: "*.fam"
  - - meta2:
        type: map
        description: Phenotype metadata
    - phenotype:
        type: file
        description: GEMMA phenotype file (one column per trait, sample order matches fam)
        pattern: "*.{txt,pheno,phe}"
  - - meta3:
        type: map
        description: Relatedness metadata
    - relatedness:
        type: file
        description: GEMMA relatedness matrix (*.cXX.txt)
        pattern: "*.{txt,cXX.txt}"
  - - meta4:
        type: map
        description: Covariate metadata; pass [] when absent
    - covariates:
        type: file
        description: Optional covariates file
        pattern: "*.{txt,cov,covar}"

output:
  assoc:
    - meta:
        type: map
        description: Groovy map containing sample information
    - "*.assoc.txt":
        type: file
        description: GEMMA association results
        pattern: "*.assoc.txt"
  log:
    - meta:
        type: map
        description: Groovy map containing sample information
    - "*.log.txt":
        type: file
        description: GEMMA log
        pattern: "*.log.txt"
  versions_gemma:
    description: Software versions
    pattern: "versions.yml"

authors:
  - "@SiYangming"
maintainers:
  - "@SiYangming"
