---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  # bioconda r-peer=1.3 only builds against R 3.3–3.4; r-base 4.x is unsatisfiable.
  - conda-forge::r-base=3.4.1
  - bioconda::r-peer=1.3
