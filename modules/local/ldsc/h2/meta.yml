---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "ldsc_h2"
description: LD-score regression style heritability and partitioned enrichment
keywords:
  - ldsc
  - heritability
  - gwas
tools:
  - "python":
      description: "LDSC-style h2 when official ldsc is not pinned"
      homepage: "https://github.com/bulik/ldsc"
      documentation: "https://github.com/bulik/ldsc"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: Groovy map containing sample information
    - sumstats:
        type: file
        description: GWAS sumstats (snp, z or beta/se, n; optional l2)
        pattern: "*.{tsv,txt,csv}"
  - - meta2:
        type: map
        description: Annotation metadata
    - annot:
        type: file
        description: Optional SNP annotation table
        pattern: "*.{tsv,txt,csv}"
  - - meta3:
        type: map
        description: Reference LD-score metadata
    - ldscores:
        type: file
        description: Optional reference-panel LD scores (snp + l2)
        pattern: "*.{tsv,txt,csv}"

output:
  h2:
    - meta:
        type: map
        description: Groovy map containing sample information
    - "*.h2.tsv":
        type: file
        description: Observed-scale heritability
        pattern: "*.h2.tsv"
  partitioned:
    - meta:
        type: map
        description: Groovy map containing sample information
    - "*.part.tsv":
        type: file
        description: Partitioned heritability / enrichment
        pattern: "*.part.tsv"
  outdir:
    - meta:
        type: map
        description: Groovy map containing sample information
    - "*_out":
        type: directory
        description: Working output directory
  versions_python:
    description: Software versions

authors:
  - "@SiYangming"
maintainers:
  - "@SiYangming"
